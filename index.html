<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solitaire</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game">
        <header>
            <h1>Solitaire</h1>
            <div class="stats">
                <span id="moves">Moves: 0</span>
                <span id="time">Time: 0:00</span>
                <span id="score">Score: 0</span>
            </div>
        </header>
        <div class="controls">
            <button id="new-game">New Game</button>
            <button id="undo">Undo</button>
        </div>
        <div id="board">
            <!-- Stock and Waste -->
            <div class="area stock-area" id="stock-area">
                <div class="pile stock" id="stock"></div>
                <div class="pile waste" id="waste"></div>
            </div>
            <!-- Foundations -->
            <div class="area foundation-area" id="foundation-area">
                <div class="pile foundation" data-suit="hearts"></div>
                <div class="pile foundation" data-suit="diamonds"></div>
                <div class="pile foundation" data-suit="clubs"></div>
                <div class="pile foundation" data-suit="spades"></div>
            </div>
            <!-- Tableau -->
            <div class="area tableau-area" id="tableau-area">
                <div class="pile tableau" data-col="0"></div>
                <div class="pile tableau" data-col="1"></div>
                <div class="pile tableau" data-col="2"></div>
                <div class="pile tableau" data-col="3"></div>
                <div class="pile tableau" data-col="4"></div>
                <div class="pile tableau" data-col="5"></div>
                <div class="pile tableau" data-col="6"></div>
            </div>
        </div>
        <div id="win-message" class="hidden">
            <h2>You Win! 🎉</h2>
            <p>Moves: <span id="final-moves"></span></p>
            <p>Time: <span id="final-time"></span></p>
            <p>Score: <span id="final-score"></span></p>
            <button id="play-again">Play Again</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
